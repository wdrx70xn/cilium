name: Datapath BPF Complexity (ci-verifier)
'on':
  issue_comment:
    types:
    - created
  schedule:
  - cron: 0 5/6 * * *
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: "${{ github.workflow }}\n${{ github.event_name }}\n${{\n  (github.event_name\
    \ == 'schedule' && github.sha) ||\n  (github.event_name == 'issue_comment' &&\
    \ (\n    github.event.comment.body == '/ci-verifier' ||\n    github.event.comment.body\
    \ == '/test'\n  ) && github.event.issue.number) ||\n  (github.event_name == 'pull_request'\
    \ && github.event.pull_request.number)\n}}\n"
  cancel-in-progress: true
env:
  check_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id
    }}
jobs:
  check_changes:
    name: Deduce required tests from code changes
    if: "(github.event_name == 'issue_comment' && (\n  github.event.comment.body ==\
      \ '/ci-verifier' ||\n  github.event.comment.body == '/test'\n)) ||\ngithub.event_name\
      \ == 'schedule' ||\ngithub.event_name == 'pull_request'\n"
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.tested-tree.outputs.src }}
    steps:
    - name: Checkout code
      if: ${{ github.event.issue.pull_request }}
      uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      with:
        persist-credentials: false
    - name: Retrieve pull request's base and head
      if: ${{ github.event.issue.pull_request }}
      id: pr
      run: 'curl ${{ github.event.issue.pull_request.url }} > pr.json

        echo "base=$(jq -r ''.base.sha'' pr.json)" >> $GITHUB_OUTPUT

        echo "head=$(jq -r ''.head.sha'' pr.json)" >> $GITHUB_OUTPUT

        '
    - name: Check code changes
      if: ${{ github.event.issue.pull_request }}
      uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50
      id: tested-tree
      with:
        base: ${{ steps.pr.outputs.base }}
        ref: ${{ steps.pr.outputs.head }}
        filters: "src:\n  - 'bpf/**'\n  - 'test/verifier/**'\n"
  setup-report:
    runs-on: ubuntu-latest
    needs: check_changes
    name: Set commit status
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
    - name: Set up job variables
      id: vars
      run: "if [ ${{ github.event.issue.pull_request || github.event.pull_request\
        \ }} ]; then\n  PR_API_JSON=$(curl \\\n    -H \"Accept: application/vnd.github.v3+json\"\
        \ \\\n    -H \"Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}\" \\\n  \
        \  ${{ github.event.issue.pull_request.url || github.event.pull_request.url\
        \ }})\n  SHA=$(echo \"$PR_API_JSON\" | jq -r \".head.sha\")\nelse\n  SHA=${{\
        \ github.sha }}\nfi\necho \"sha=${SHA}\" >> $GITHUB_OUTPUT\n"
    - name: Set commit status to pending
      uses: Sibz/github-status-action@650dd1a882a76dbbbc4576fb5974b8d22f29847f
      with:
        authToken: ${{ secrets.GITHUB_TOKEN }}
        sha: ${{ steps.vars.outputs.sha }}
        context: ${{ github.workflow }}
        description: Datapath BPF Complexity test in progress...
        state: pending
        target_url: ${{ env.check_url }}
  skip-test-run:
    if: github.event.comment.body == '/test' && needs.check_changes.outputs.tested
      == 'false'
    runs-on: ubuntu-latest
    needs: setup-report
    steps:
    - name: Set commit status to success
      uses: Sibz/github-status-action@650dd1a882a76dbbbc4576fb5974b8d22f29847f
      with:
        authToken: ${{ secrets.GITHUB_TOKEN }}
        sha: ${{ needs.setup-report.outputs.sha }}
        context: ${{ github.workflow }}
        description: Datapath BPF Complexity tests skipped
        state: success
        target_url: ${{ env.check_url }}
  setup-and-test:
    runs-on: ubuntu-latest
    needs: setup-report
    name: Setup & Test
    if: "(github.event_name == 'issue_comment' && (\n  github.event.comment.body ==\
      \ '/ci-verifier' ||\n  (github.event.comment.body == '/test' && needs.check_changes.outputs.tested\
      \ == 'true')\n)) ||\ngithub.event_name == 'schedule' ||\ngithub.event_name ==\
      \ 'pull_request'\n"
    strategy:
      fail-fast: false
      matrix:
        include:
        - kernel: 4.19-main
          ci-kernel: '419'
        - kernel: 5.4-main
          ci-kernel: '54'
        - kernel: 5.10-main
          ci-kernel: '510'
        - kernel: 5.15-main
          ci-kernel: '510'
        - kernel: bpf-next-main
          ci-kernel: netnext
    timeout-minutes: 60
    steps:
    - name: Checkout pull request
      uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      with:
        ref: ${{ needs.setup-report.outputs.sha }}
        persist-credentials: false
    - name: Provision LVH VMs
      uses: cilium/little-vm-helper@0b7d7157dae56a44dc531c852e7756dc671071af
      with:
        test-name: datapath-bpf-complexity
        image-version: ${{ matrix.kernel }}
        host-mount: ./
        cpu: 4
        dns-resolver: 1.1.1.1
        install-dependencies: 'true'
        cmd: 'git config --global --add safe.directory /host

          uname -a

          '
    - name: Run verifier tests
      uses: cilium/little-vm-helper@0b7d7157dae56a44dc531c852e7756dc671071af
      with:
        provision: 'false'
        cmd: "cd /host/\n# Run with cgo disabled, LVH images don't ship with gcc.\n\
          CGO_ENABLED=0 go test -c ./test/verifier\ndocker run -t --privileged \\\n\
          \  -v /sys/fs/bpf:/sys/fs/bpf \\\n  -v \"\\$PWD:/cilium\" \\\n  -w \"/cilium/test/verifier\"\
          \ \\\n  quay.io/cilium/test-verifier:2ecf56b4ea57576e9d92d34407898e5d14e80aa3@sha256:62396cedb4f15477f0084d7dfc92de55ac9ab8531021b7ac5f56220c35f2cb64\
          \ \\\n  /cilium/verifier.test -test.v -test.parallel=1 -cilium-base-path\
          \ /cilium -ci-kernel-version ${{ matrix.ci-kernel }}\n"
    - name: Fetch artifacts
      if: ${{ !success() }}
      uses: cilium/little-vm-helper@0b7d7157dae56a44dc531c852e7756dc671071af
      with:
        provision: 'false'
        cmd: 'cd /host

          mkdir datapath-verifier

          cp bpf/*.o datapath-verifier

          find test/verifier -name "*.log" -exec cp {} datapath-verifier/ \;

          '
    - name: Upload artifacts
      if: ${{ !success() }}
      uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce
      with:
        name: datapath-verifier
        path: datapath-verifier
        retention-days: 5
  report-success:
    runs-on: ubuntu-latest
    needs:
    - setup-report
    - setup-and-test
    name: Set commit status to success
    if: ${{ success() }}
    steps:
    - uses: Sibz/github-status-action@650dd1a882a76dbbbc4576fb5974b8d22f29847f
      with:
        authToken: ${{ secrets.GITHUB_TOKEN }}
        sha: ${{ needs.setup-report.outputs.sha }}
        context: ${{ github.workflow }}
        description: Datapath BPF Complexity tests successful
        state: success
        target_url: ${{ env.check_url }}
  report-failure:
    runs-on: ubuntu-latest
    needs:
    - setup-report
    - setup-and-test
    name: Set commit status to failure
    if: ${{ failure() }}
    steps:
    - uses: Sibz/github-status-action@650dd1a882a76dbbbc4576fb5974b8d22f29847f
      with:
        authToken: ${{ secrets.GITHUB_TOKEN }}
        sha: ${{ needs.setup-report.outputs.sha }}
        context: ${{ github.workflow }}
        description: Datapath BPF Complexity tests failed
        state: failure
        target_url: ${{ env.check_url }}
  report-cancelled:
    runs-on: ubuntu-latest
    needs:
    - setup-report
    - setup-and-test
    name: Set commit status to cancelled
    if: ${{ cancelled() }}
    steps:
    - uses: Sibz/github-status-action@650dd1a882a76dbbbc4576fb5974b8d22f29847f
      with:
        authToken: ${{ secrets.GITHUB_TOKEN }}
        sha: ${{ needs.setup-report.outputs.sha }}
        context: ${{ github.workflow }}
        description: Datapath BPF Complexity tests cancelled
        state: error
        target_url: ${{ env.check_url }}
